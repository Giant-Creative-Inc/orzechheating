# Shared GridPane hybrid deployment configuration.
#
# Copy the entire .gpconfig directory to another project, then update this file.
# Do not add secrets or environment-specific domains here; GridPane site details
# are derived from GP_GIT_RELEASE_PATH at deployment time.

# Project layout.
readonly GP_DEPLOY_THEME_PATH="wp-content/themes/salient-child"
readonly GP_DEPLOY_PACKAGE_FILE="package.json"
readonly GP_DEPLOY_LOCK_FILE="package-lock.json"
readonly GP_DEPLOY_CSS_OUTPUT_DIR="assets/css"
readonly GP_DEPLOY_JS_OUTPUT_DIR="assets/js"

# Reproducible frontend build commands and their required executables.
readonly -a GP_DEPLOY_INSTALL_COMMAND=(npm ci --no-audit --no-fund)
readonly -a GP_DEPLOY_BUILD_COMMAND=(npm run build)
readonly -a GP_DEPLOY_BUILD_REQUIRED_COMMANDS=(node npm timeout stat)
readonly -a GP_DEPLOY_WP_REQUIRED_COMMANDS=(wp timeout)
readonly -a GP_DEPLOY_POST_REQUIRED_COMMANDS=(gp curl nohup timeout)

# GridPane paths and generated file names.
readonly GP_DEPLOY_RELEASES_DIR_NAME="releases"
readonly GP_DEPLOY_LIVE_DIR_NAME="htdocs"
readonly GP_DEPLOY_LOG_DIR_NAME="logs"
readonly GP_DEPLOY_MARKER_FILE=".gp-release"
readonly GP_DEPLOY_LOG_PREFIX="git-deploy"

# Synchronous deployment command limits, in seconds.
readonly GP_DEPLOY_INSTALL_TIMEOUT=300
readonly GP_DEPLOY_BUILD_TIMEOUT=300
readonly GP_DEPLOY_WP_CHECK_TIMEOUT=60
readonly GP_DEPLOY_WP_UPDATE_TIMEOUT=300

# Post-rsync detection. Total wait is attempts multiplied by interval.
readonly GP_DEPLOY_RSYNC_WAIT_ATTEMPTS=90
readonly GP_DEPLOY_RSYNC_WAIT_INTERVAL=2
readonly GP_DEPLOY_POST_RSYNC_DELAY=5

# GridPane file permission repair.
readonly GP_DEPLOY_PERMISSIONS_TIMEOUT=120
readonly GP_DEPLOY_PERMISSIONS_ATTEMPTS=3
readonly GP_DEPLOY_PERMISSIONS_RETRY_INTERVAL=5

# GridPane cache purge.
readonly GP_DEPLOY_CACHE_PURGE_TIMEOUT=120

# Public health check. The site domain is derived automatically.
readonly GP_DEPLOY_HEALTH_SCHEME="https"
readonly GP_DEPLOY_HEALTH_PATH="/"
readonly GP_DEPLOY_HEALTH_ATTEMPTS=5
readonly GP_DEPLOY_HEALTH_RETRY_INTERVAL=5
readonly GP_DEPLOY_HEALTH_MAX_REDIRECTS=5
readonly GP_DEPLOY_HEALTH_CONNECT_TIMEOUT=5
readonly GP_DEPLOY_HEALTH_MAX_TIME=15
